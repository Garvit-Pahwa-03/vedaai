<svg width="860" height="520" viewBox="0 0 860 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="860" height="520" rx="16" fill="#0f1117"/>

  <!-- Column labels -->
  <text x="145" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#9ca3af" font-weight="500">Frontend</text>
  <text x="430" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#9ca3af" font-weight="500">Backend</text>
  <text x="715" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#9ca3af" font-weight="500">Storage</text>

  <!-- ── ROW 1 ── -->

  <!-- Next.js Frontend -->
  <rect x="30" y="60" width="230" height="72" rx="12" fill="#1d4ed8"/>
  <text x="145" y="91" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="white" font-weight="700">Next.js Frontend</text>
  <text x="145" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#bfdbfe">Zustand · WebSocket</text>

  <!-- Express API -->
  <rect x="315" y="60" width="230" height="72" rx="12" fill="#6d28d9"/>
  <text x="430" y="91" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="white" font-weight="700">Express API</text>
  <text x="430" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#ddd6fe">Node.js · TypeScript</text>

  <!-- MongoDB -->
  <rect x="600" y="60" width="230" height="72" rx="12" fill="#166534"/>
  <text x="715" y="91" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="white" font-weight="700">MongoDB</text>
  <text x="715" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#bbf7d0">Assignments · results</text>

  <!-- Arrow: Frontend ↔ API (bidirectional) -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <line x1="260" y1="96" x2="313" y2="96" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/>

  <!-- Arrow: API → MongoDB -->
  <line x1="545" y1="96" x2="598" y2="96" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── ROW 2 ── -->

  <!-- BullMQ Worker -->
  <rect x="315" y="200" width="230" height="72" rx="12" fill="#92400e"/>
  <text x="430" y="231" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="white" font-weight="700">BullMQ Worker</text>
  <text x="430" y="253" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fde68a">Background jobs</text>

  <!-- Redis -->
  <rect x="600" y="200" width="230" height="72" rx="12" fill="#7f1d1d"/>
  <text x="715" y="231" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="white" font-weight="700">Redis</text>
  <text x="715" y="253" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fca5a5">Cache · job state</text>

  <!-- Arrow: API → BullMQ -->
  <line x1="430" y1="132" x2="430" y2="198" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow: BullMQ → Redis -->
  <line x1="545" y1="236" x2="598" y2="236" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── ROW 3 ── -->

  <!-- WebSocket Server -->
  <rect x="30" y="340" width="230" height="72" rx="12" fill="#9d174d"/>
  <text x="145" y="371" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="white" font-weight="700">WebSocket Server</text>
  <text x="145" y="393" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fbcfe8">Real-time updates</text>

  <!-- LLM -->
  <rect x="315" y="340" width="230" height="72" rx="12" fill="#065f46"/>
  <text x="430" y="371" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="white" font-weight="700">LLM (Groq)</text>
  <text x="430" y="393" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6ee7b7">Prompt → structured Q</text>

  <!-- PDF Generator -->
  <rect x="600" y="340" width="230" height="72" rx="12" fill="#374151"/>
  <text x="715" y="371" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="white" font-weight="700">PDF Generator</text>
  <text x="715" y="393" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#d1d5db">Print CSS · BullMQ job</text>

  <!-- Arrow: BullMQ → LLM -->
  <line x1="430" y1="272" x2="430" y2="338" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow: LLM → WebSocket -->
  <line x1="313" y1="376" x2="262" y2="376" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow: LLM → PDF -->
  <line x1="545" y1="376" x2="598" y2="376" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow: WebSocket → Frontend (vertical left side) -->
  <line x1="145" y1="338" x2="145" y2="134" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Flow label -->
  <text x="430" y="468" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">
    Request → API → BullMQ job → Worker → LLM → Store → WebSocket → Frontend
  </text>
</svg>
